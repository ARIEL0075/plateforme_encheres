<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier l'annonce - {{ objet.nom }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h2>Modifier l'objet : {{ objet.nom }}</h2>

        <form action="/modifier/{{ objet.id }}" method="POST" class="add-form">
            <label>Nom de l'objet :</label>
            <input type="text" name="nom" value="{{ objet.nom }}" required>

            <label>Description :</label>
            <textarea name="description">{{ objet.description }}</textarea>

            <label>Prix actuel (€) :</label>
            <input type="number" name="prix" step="0.01" value="{{ objet.prix_actuel }}" required>

            <label>Statut de la vente :</label>
            <select name="etat">
                <option value="EN_COURS" {% if objet.etat.value == 'EN_COURS' %}selected{% endif %}>En cours</option>
                <option value="TERMINE" {% if objet.etat.value == 'TERMINE' %}selected{% endif %}>Terminé</option>
            </select>

            <div style="margin-top: 20px;">
                <button type="submit" class="btn-submit">Enregistrer les modifications</button>
                <a href="{{ url_for('index') }}" class="btn-modifier" style="background-color: #666;">Annuler</a>
            </div>
        </form>
    </div>
</body>
</html>
