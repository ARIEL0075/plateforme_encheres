<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier un objet</title>
</head>
<body>

    <h2>Modifier l'objet</h2>

    <form method="POST">
        <input type="text" name="nom" value="{{ objet.nom }}" required>
        <br><br>

        <input type="text" name="description" value="{{ objet.description }}">
        <br><br>

        <input type="number" name="prix" value="{{ objet.prix_actuel }}" required>
        <br><br>

        <button type="submit">Enregistrer modification</button>
    </form>

    <br>
    <a href="{{ url_for('index') }}">Retour</a>

</body>
</html>
